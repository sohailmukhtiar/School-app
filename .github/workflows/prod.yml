name: Production CI/CD

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2️⃣ Setup Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3️⃣ Docker Login
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4️⃣ Test SonarQube API (optional debug)
    - name: Test SonarQube API
      run: |
        curl -v ${{ secrets.SONARQUBE_URL }}/api/system/status

    # 5️⃣ SonarQube Scan
    - name: Sonar Scan
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/usr/src \
          sonarsource/sonar-scanner-cli \
          -Dsonar.projectKey=myapp \
          -Dsonar.sources=. \
          -Dsonar.host.url="${{ secrets.SONARQUBE_URL }}" \
          -Dsonar.login="${{ secrets.SONARQUBE_TOKEN }}"

    # 6️⃣ Build Docker Images using Compose
    - name: Build Images
      run: |
        docker compose -f docker-compose.build.yml build

    # 7️⃣ Push Docker Images
    - name: Push Images
      run: |
        docker compose -f docker-compose.build.yml push

    # 8️⃣ Deploy to Remote Server via SSH
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          export DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          export IMAGE_TAG=${{ github.sha }}
          cd /app
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d
