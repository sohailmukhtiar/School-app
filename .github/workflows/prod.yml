name: Production CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_BACKEND: ghcr.io/${{ github.actor }}/backend-app
  IMAGE_FRONTEND: ghcr.io/${{ github.actor }}/frontend-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2️⃣ Login to GHCR
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    # 3️⃣ SonarQube Scan
    - name: Sonar Scan
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/usr/src \
          sonarsource/sonar-scanner-cli \
          -Dsonar.projectKey=myapp \
          -Dsonar.sources=. \
          -Dsonar.host.url="${{ secrets.SONARQUBE_URL }}" \
          -Dsonar.login="${{ secrets.SONARQUBE_TOKEN }}"

    # 4️⃣ Build & Push Backend
    - name: Build Backend Image
      run: |
        docker build -t $IMAGE_BACKEND:latest Docker-Compose-Projects/backend
        docker push $IMAGE_BACKEND:latest

    # 5️⃣ Build & Push Frontend
    - name: Build Frontend Image
      run: |
        docker build -t $IMAGE_FRONTEND:latest Docker-Compose-Projects/frontend
        docker push $IMAGE_FRONTEND:latest

    # 6️⃣ Copy Deploy File To Server
    - name: Copy Deploy File
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: Docker-Compose-Projects/docker-compose.deploy.yml
        target: ~/app/Docker-Compose-Projects/
        overwrite: true

    # 7️⃣ Deploy On Server
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          cd ~/app/Docker-Compose-Projects
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d
