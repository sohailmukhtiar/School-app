name: Production CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.actor }}/backend-app
  IMAGE_FRONTEND: ghcr.io/${{ github.actor }}/frontend-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2️⃣ Login to GHCR
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3️⃣ SonarQube Scan
    - name: Sonar Scan
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/usr/src \
          sonarsource/sonar-scanner-cli \
          -Dsonar.projectKey=myapp \
          -Dsonar.sources=. \
          -Dsonar.host.url="${{ secrets.SONARQUBE_URL }}" \
          -Dsonar.login="${{ secrets.SONARQUBE_TOKEN }}"

    # 4️⃣ Build Backend Image
    - name: Build Backend
      run: |
        docker build -t $IMAGE_BACKEND:$IMAGE_TAG ./backend
        docker push $IMAGE_BACKEND:$IMAGE_TAG

    # 5️⃣ Build Frontend Image
    - name: Build Frontend
      run: |
        docker build -t $IMAGE_FRONTEND:$IMAGE_TAG ./frontend
        docker push $IMAGE_FRONTEND:$IMAGE_TAG

    # 6️⃣ Copy Deploy Compose to Server
    - name: Copy Deploy File
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: Docker-Compose-Projects/docker-compose.deploy.yml
        target: /app/docker-compose.deploy.yml

    # 7️⃣ Deploy on Server
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          export IMAGE_TAG=${{ github.sha }}
          cd /app
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d
